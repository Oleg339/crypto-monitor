<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Obsidian Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@400;600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
          <path d="M12 2 4 8v8l8 6 8-6V8z"/><path d="M12 7v10M7 9.5l10 5M17 9.5l-10 5"/>
        </svg>
      </span>
      <div>
        <div id="app-title">OBSIDIAN</div>
        <div id="updated"><span id="live-dot"></span><span id="updated-text">&nbsp;</span></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="auto-btn" class="icon-btn" aria-label="Авторежим" style="display:none">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="9" width="14" height="10" rx="2"/>
          <path d="M12 5v4"/><circle cx="12" cy="3.5" r="1"/>
          <path d="M9 13.5v1.5M15 13.5v1.5"/>
        </svg>
      </button>
      <div class="theme-wrap">
        <button id="theme-btn" class="icon-btn" aria-label="Тема оформления">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <div id="theme-menu" hidden>
          <button class="theme-opt" data-theme="obsidian">
            <span class="sw sw-obsidian"></span>Obsidian
            <svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="theme-opt" data-theme="neo">
            <span class="sw sw-neo"></span>Неоморфизм
            <svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="theme-opt" data-theme="garden">
            <span class="sw sw-garden"></span>Сад 🌱
            <svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>
      <button id="zen-btn" class="icon-btn" aria-label="Дзен-режим">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3A9 9 0 0 1 12 21A4.5 4.5 0 0 1 12 12A4.5 4.5 0 0 0 12 3Z" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="7.5" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="16.5" r="1.5" fill="var(--panel)" stroke="none"/>
        </svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="tabs-wrap">
    <span id="tabs-sentinel" aria-hidden="true"></span>
    <nav id="tabs">
      <button class="tab active" data-tab="overview">Обзор</button>
      <button class="tab" data-tab="trades">Сделки</button>
      <button class="tab" data-tab="orders">Ордеры</button>
      <span id="tab-glider"></span>
    </nav>
  </div>

  <main>
    <section id="overview" class="page active">
      <div id="garden"></div>

      <div id="balance-card" class="hero">
        <div class="skel skel-lg"></div>
        <div class="skel skel-sm"></div>
      </div>

      <div id="stat-grid" class="stat-grid"></div>
      <div id="expectation" class="expectation" style="display:none"></div>

      <div class="card chart-card">
        <div class="card-title-row">
          <h2>Equity · Σ PnL %</h2>
          <span id="equity-last" class="chart-last"></span>
        </div>
        <div id="equity-wrap">
          <svg id="equity-chart" viewBox="0 0 340 140" preserveAspectRatio="none"></svg>
          <div id="eq-tip" style="display:none"></div>
          <div id="equity-axis"></div>
        </div>
      </div>

      <h2 class="section-h">Открытые позиции <span id="pos-count" class="count"></span></h2>
      <div id="positions"><div class="skel skel-card"></div></div>
    </section>

    <section id="trades" class="page">
      <div id="trade-stats" class="stat-grid"></div>
      <div class="filters" id="trade-filters">
        <span id="chip-glider"></span>
        <button class="chip active" data-f="all">Все</button>
        <button class="chip" data-f="win">Прибыльные</button>
        <button class="chip" data-f="loss">Убыточные</button>
        <button class="chip" data-f="open">Открытые</button>
      </div>
      <div id="trades-list"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
    </section>

    <section id="orders" class="page">
      <!-- без заголовка: любой текст первым элементом здесь вызывает
           артефакт тени у шкалы на мобильном WebKit -->
      <div id="orders-list"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
    </section>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
