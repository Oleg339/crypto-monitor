<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Obsidian Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
          <path d="M12 2 4 8v8l8 6 8-6V8z"/><path d="M12 7v10M7 9.5l10 5M17 9.5l-10 5"/>
        </svg>
      </span>
      <div>
        <div id="app-title">OBSIDIAN</div>
        <div id="updated"><span id="live-dot"></span><span id="updated-text">&nbsp;</span></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="zen-btn" class="icon-btn" aria-label="Дзен-режим">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab active" data-tab="overview">Обзор</button>
    <button class="tab" data-tab="trades">Сделки</button>
    <button class="tab" data-tab="signals">Сигналы</button>
    <span id="tab-glider"></span>
  </nav>

  <main>
    <section id="overview" class="page active">
      <div id="balance-card" class="hero">
        <div class="skel skel-lg"></div>
        <div class="skel skel-sm"></div>
      </div>

      <div id="stat-grid" class="stat-grid"></div>
      <div id="expectation" class="expectation" style="display:none"></div>

      <div class="card chart-card">
        <div class="card-title-row">
          <h2>Equity · Σ PnL %</h2>
          <span id="equity-last" class="chart-last"></span>
        </div>
        <div id="equity-wrap">
          <svg id="equity-chart" viewBox="0 0 340 140" preserveAspectRatio="none"></svg>
          <div id="equity-axis"></div>
        </div>
      </div>

      <h2 class="section-h">Открытые позиции <span id="pos-count" class="count"></span></h2>
      <div id="positions"><div class="skel skel-card"></div></div>
    </section>

    <section id="trades" class="page">
      <div id="trade-stats" class="stat-grid"></div>
      <div class="filters" id="trade-filters">
        <button class="chip active" data-f="all">Все</button>
        <button class="chip" data-f="win">Прибыльные</button>
        <button class="chip" data-f="loss">Убыточные</button>
        <button class="chip" data-f="open">Открытые</button>
      </div>
      <div id="trades-list"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
    </section>

    <section id="signals" class="page">
      <h2 class="section-h">Последние сигналы</h2>
      <div id="signals-list"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
